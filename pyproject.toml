[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-billing-audit"
version = "0.4.0"
description = "Pre-bill medical-claim auditor — flags dx-code, modifier, and global-window issues before submission."
readme = "README.md"
# Proprietary, matching README.md ("Proprietary — all rights reserved").
# This previously said "MIT" while the README said proprietary — the SPDX
# field is what packaging tooling and registries read, so the two must agree.
# A LICENSE file with the full terms is still open (issue #16).
license = { text = "Proprietary" }
authors = [
    { name = "Cameron Ashley" },
]
keywords = ["llm", "billing", "audit", "medical-claims", "dspy"]
# Canonical baseline is Python 3.11 (pinned in .python-version and the only
# version .github/workflows/test-on-pr.yml runs); the runtime image is
# 3.12-slim. The floor is set to 3.10 rather than 3.11 because the full suite
# has been verified passing on 3.10 — blocking it would be gratuitous. Raising
# the floor to 3.11 is a policy choice, not a technical one, so it is left to
# the maintainer. Previously this field was absent entirely, so packaging
# enforced no floor at all.
requires-python = ">=3.10"
# Pinned to dated versions — see docs/SEC_REVIEW_deps.md (kanban t_c7d352a7)
# Audit run: 2026-06-17 (CVE-2025-69872 diskcache open, no fix available)
dependencies = [
    "dspy==3.2.1",
    "litellm==1.89.1",
    "fastapi==0.137.1",
    "jinja2==3.1.6",
    "cryptography==50.0.0",  # encrypted backup/restore support
    "reportlab==4.4.10",  # production monthly PDF renderer
    "optuna==4.9.0",  # required by dspy.MIPROv2 at runtime
    "python-multipart==0.0.32",  # required by FastAPI File() / Form() parsing
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "ruff==0.12.10",
    "mypy==1.17.1",
    "types-jsonschema==4.26.0.20260518",
    "dspy[optuna]==3.2.1",  # the compile-mode tests exercise MIPROv2 end-to-end
]

[project.urls]
Homepage = "https://ai-billing-audit.ashbi.ca"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# auditor.py loads the auditor prompt via importlib.resources. Declared
# explicitly so it stays in the wheel deterministically: setuptools already
# includes in-package data files by default (verified — a wheel built without
# this section still contained auditor_prompt.txt), so this is belt-and-braces
# against a future include-package-data = false rather than a fix for a
# current break.
[tool.setuptools.package-data]
ai_billing_audit = ["auditor_prompt.txt"]

[project.scripts]
zorva-admin = "ai_billing_audit.admin_cli:main"

[tool.ruff]
# CI runs `ruff check .` and `ruff format --check .` as blocking steps, but
# there was no [tool.ruff] section at all, so both ran on ruff's defaults and
# nothing about the enforced style was reviewable. This makes the effective
# settings explicit without changing them.
line-length = 88
# Matches requires-python above. Raising this to py311 changes which
# version-gated rules fire, so it is a deliberate change, not a tidy-up.
target-version = "py310"
# `select` is intentionally omitted: ruff's default is E4/E7/E9/F, and
# declaring a different set here would silently change what CI enforces.
# Adding rules is a deliberate change to make alongside a green CI run.

[tool.mypy]
# CI runs `mypy src/ai_billing_audit`; `files` lets a contributor run a bare
# `mypy` and get exactly what CI checks, instead of a different scope.
files = ["src/ai_billing_audit"]
# The three settings below were verified clean against the current tree, so
# they tighten the check without failing it. Left off deliberately:
#   * warn_unused_ignores — 8 of the 31 `# type: ignore` comments are now
#     unnecessary (analytics.py:203, feedback.py:863, per_clinic_f1.py:1026,
#     per_clinic_f1.py:1114, newsletter.py:43, contact.py:215, api.py:2420,
#     api.py:4755). Several are circular-import guards whose necessity
#     depends on how mypy resolves the deferred `from .api import ...`, so
#     removing them should be done in a change that also runs CI.
#   * warn_return_any — 14 errors today. Real work, not a config toggle.
#   * disallow_untyped_defs / strict — not attempted; this package has a lot
#     of untyped surface and strictness should be adopted incrementally.
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: exercises a real external provider and requires operator-supplied credentials",
]
