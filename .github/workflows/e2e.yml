name: e2e

on:
  pull_request:
    branches: [main, feat/**]
  # Keep the smoke gate observable after merges as well as on PRs.
  push:
    branches: [main, feat/billing-page]

# Cancel in-progress runs for the same PR — the suite is short
# enough that re-running on a force-push is the desired behavior.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: browser journey (chromium; HQ + customer flows; mock audit engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Next.js dev server listens on 3000 inside the runner.
      PORT: 3000
      # Auth runs in dev-stub mode (no real Resend key, magic link
      # is logged to /tmp/portal-dev.log).
      AUTH_RESEND_KEY: ""
      # Contact-to-HQ conversion is exercised with durable local capture only.
      # These explicit placeholders prevent email or Slack delivery in CI.
      RESEND_API_KEY: "***"
      LEADS_SLACK_WEBHOOK_URL: "***"
      AUTH_SECRET: e2e-test-secret-do-not-use-in-prod-please
      DATABASE_URL: "file:./prisma/dev.db"
      # Stable environment so the pricing env fallback in
      # src/lib/pricing.ts returns the canonical Zorva defaults.
      NODE_ENV: development
      # The e2e seed + post-seed scripts and the magic-link helper
      # all read this — must be a syntactically valid email address.
      E2E_USER_EMAIL: e2e+e2e-clinic@ai-billing-audit.test
      E2E_TENANT_SLUG: e2e-clinic
      # Keep Auth.js callbacks and Playwright's request context on the same
      # origin so the host-scoped session cookie is exercised by API calls.
      AUTH_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      FASTAPI_BASE_URL: http://127.0.0.1:8010
      FASTAPI_BEARER_TOKEN: e2e-bearer-token-at-least-thirty-two-bytes
      FASTAPI_PRINCIPAL_SIGNING_SECRET: e2e-signing-secret-at-least-thirty-two-bytes
      PATIENT_HASH_PEPPER: e2e-patient-hash-pepper-at-least-thirty-two-bytes
      # Explicit non-production Auth.js test seam. The one-time URL is stored
      # mode 0600 on the ephemeral runner and is never printed or uploaded.
      E2E_AUTH_CAPTURE_FILE: /tmp/portal-e2e-auth-link.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: apps/portal/pnpm-lock.yaml

      - name: Install deps
        working-directory: apps/portal
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral fixture-encryption key
        run: |
          key=$(openssl rand -base64 32)
          echo "::add-mask::$key"
          echo "ZORVA_PHI_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        working-directory: apps/portal
        run: pnpm test:e2e:install

      - name: Apply Prisma migrations (SQLite)
        working-directory: apps/portal
        run: |
          pnpm prisma:generate
          pnpm exec prisma migrate deploy

      - name: Type-check the suite
        working-directory: apps/portal
        run: pnpm exec tsc --noEmit -p tests/e2e/tsconfig.json

      - name: Boot the dev server
        working-directory: apps/portal
        run: |
          nohup node tests/e2e/mock-audit-engine.mjs > /tmp/mock-audit-engine.log 2>&1 &
          for i in {1..20}; do
            if curl -sS http://127.0.0.1:8010/not-found >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Background the dev server; capture its output so the
          # magic-link helper can find the [auth] line in /tmp/portal-dev.log.
          nohup pnpm dev > /tmp/portal-dev.log 2>&1 &
          # Wait for it to come up.
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
              echo "dev server up after ${i}s"
              break
            fi
            sleep 1
          done
          # Final probe.
          curl -fsS http://127.0.0.1:3000 >/dev/null

      - name: Run the smoke suite
        working-directory: apps/portal
        run: pnpm test:e2e

      - name: Run accessibility and performance gates
        working-directory: apps/portal
        env:
          BASE_URL: http://127.0.0.1:3000
        run: pnpm gate:all

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/portal/tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/portal/tests/e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/portal/tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
