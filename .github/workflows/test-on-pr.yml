# PR-only CI gate. Conservative on purpose:
#   - Triggers ONLY on pull_request events, never on push to main.
#     (main pushes are covered by the deployment workflow.)
#   - Does not modify the existing e2e.yml workflow.
#   - Posts a single summary comment with pass/fail + test counts.
#   - Uses concurrency cancellation so re-pushes to a PR don't pile
#     up redundant runs.
name: test-on-pr

on:
  pull_request:
    branches: [main]
    # Don't run on draft PRs — saves minutes for WIP.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Re-runs on force-push kill prior in-flight runs for the same PR.
concurrency:
  group: test-on-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to post the summary comment on the PR.
  pull-requests: write

jobs:
  python-checks:
    name: python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pytest_passed: ${{ steps.pytest_counts.outputs.passed }}
      pytest_failed: ${{ steps.pytest_counts.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install deps (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        # Strict on the audit package, lenient elsewhere — matches
        # the in-repo pyproject.toml [tool.mypy] overrides.
        run: mypy src/ai_billing_audit

      - name: pytest
        id: pytest
        run: |
          set -o pipefail
          {
            echo "## pytest"
            pytest --maxfail=1 -q --tb=short \
              --junitxml=/tmp/pytest-junit.xml 2>&1 | tee /tmp/pytest-out.txt
          }

      - name: Extract pytest counts
        if: always()
        id: pytest_counts
        run: |
          PASS=$(grep -oE '[0-9]+ passed' /tmp/pytest-out.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          FAIL=$(grep -oE '[0-9]+ failed' /tmp/pytest-out.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "passed=$PASS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAIL" >> "$GITHUB_OUTPUT"
          echo "pytest passed=$PASS failed=$FAIL"

      - name: Upload pytest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: /tmp/pytest-junit.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Python summary
        if: always()
        run: |
          {
            echo "### python"
            echo "- pytest step: ${{ steps.pytest.outcome }}"
            echo "- ruff format --check: see logs"
            echo "- mypy: blocking"
            echo "- pytest: ${{ steps.pytest_counts.outputs.passed }} passed, ${{ steps.pytest_counts.outputs.failed }} failed"
          } >> "$GITHUB_STEP_SUMMARY"

  portal-typecheck:
    name: portal (PostgreSQL + lint + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://zorva:zorva_ci_password@127.0.0.1:5432/zorva
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zorva
          POSTGRES_PASSWORD: zorva_ci_password
          POSTGRES_DB: zorva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zorva -d zorva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: apps/portal/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm prisma:migrate:deploy:postgresql

      - name: Database runtime tests
        run: pnpm test:database-runtime

      - name: Design-token policy
        run: pnpm tokens:check

      - name: ESLint
        run: pnpm lint

      - name: pnpm tsc --noEmit
        id: tsc
        run: pnpm exec tsc --noEmit

      - name: Production build
        id: build
        run: pnpm build

      - name: Portal summary
        if: always()
        run: |
          {
            echo "### portal"
            echo "- PostgreSQL migration: blocking"
            echo "- ESLint: blocking"
            echo "- tsc --noEmit: ${{ steps.tsc.outcome == 'success' && 'passed' || 'failed (see logs)' }}"
            echo "- production build: ${{ steps.build.outcome == 'success' && 'passed' || 'failed (see logs)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: summary comment
    runs-on: ubuntu-latest
    needs: [python-checks, portal-typecheck]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const pyStep   = "python-checks";
            const tsStep   = "portal-typecheck";
            const pyStatus = "${{ needs.python-checks.result }}";
            const tsStatus = "${{ needs.portal-typecheck.result }}";
            const pyPassed = "${{ needs.python-checks.outputs.pytest_passed }}" || "0";
            const pyFailed = "${{ needs.python-checks.outputs.pytest_failed }}" || "0";

            const overall = (pyStatus === "success" && tsStatus === "success")
              ? "✅ all checks passed"
              : `❌ one or more checks failed (python: ${pyStatus}, portal: ${tsStatus})`;

            const body = [
              "## CI summary",
              "",
              overall,
              "",
              "| job | result |",
              "|---|---|",
              `| python (ruff + mypy + pytest) | ${pyStatus} |`,
              `| portal (PostgreSQL + lint + types + build) | ${tsStatus} |`,
              "",
              "**pytest:** " + pyPassed + " passed, " + pyFailed + " failed",
              "",
              "_Full logs in the workflow run._",
            ].join("\n");

            // Upsert: delete any prior comment from this workflow on
            // the same PR, then post a fresh one.
            const marker = "<!-- zorva-ci-summary -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            for (const c of comments) {
              if (c.body && c.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: marker + "\n" + body,
            });
