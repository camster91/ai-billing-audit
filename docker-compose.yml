# ai-billing-audit — production docker-compose
#
# Four services per the v1 task spec (kanban t_7f6ffde6):
#
#   api       FastAPI + uvicorn on :8000. Serves the demo dashboard,
#             encounter upload portal, and /healthz. The /healthz
#             endpoint returns the running version string.
#   worker    Job-queue sidecar. v1 keeps the queue in-process inside
#             the api; the worker container is a no-op heartbeat loop
#             so the 4-service topology matches the spec. A future
#             card replaces this with a broker-backed worker.
#   postgres  Postgres 16 with the pgvector extension available. The
#             v1 synth mode does not require pgvector to be loaded,
#             but the image ships it so the v1 vector KB is one
#             `CREATE EXTENSION` away. The audit-trail schema
#             (audit_trail.sql) is mounted into /docker-entrypoint-
#             initdb.d/ and auto-applied on first boot.
#   caddy     Internal reverse proxy. The PUBLIC TLS edge is
#             Traefik on the host (port 80/443 with Let's Encrypt
#             auto-issuance). This in-stack Caddy terminates the
#             internal hop on plain HTTP and forwards to the api
#             service. Exposed on host port 3018 (loopback only);
#             host Traefik reverse-proxies ai-billing-audit.ashbi.ca
#             to 127.0.0.1:3018.
#
# Persistent volumes:
#   - ai_billing_audit_data      → /data (job-queue JSONL, run logs)
#   - ai_billing_audit_artifacts → /artifacts (synth outputs, audit exports)
#   - ai_billing_audit_logs      → /app/logs (uploaded_notes, audit_trail.jsonl,
#                                       doctor_emails.jsonl, opt-outs.json,
#                                       NPI email cache) — survives container
#                                       recreates so the biller doesn't lose
#                                       their action history
#   - ai_billing_audit_pgdata    → /var/lib/postgresql/data (postgres cluster)
#
# Environment:
#   - .env (or environment block below) provides LLM_PROVIDER, MINIMAX_API_KEY,
#     MINIMAX_BASE_URL, DATABASE_URL, AUDIT_TRAIL_DB. Secrets are loaded
#     from /root/ai-billing-audit/.env on the host (written by deploy-to-vps.sh).
#   - MINIMAX_API_KEY is a placeholder; the deploy script injects the real key
#     from /root/coolify-secrets/... on the host.
#
# LLM_MODEL pin (kanban t_c976c5cd):
#   LLM_MODEL is set in deploy-to-vps.sh → .env, NOT here. The value is
#   a date-suffixed snapshot (e.g. `MiniMax-M3-2026-06-23`) so the
#   unversioned `MiniMax-M3` alias can never silently roll forward.
#   See docs/llm-pinning.md for the re-pin procedure.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-billing-audit:0.4.0
    container_name: ai-billing-audit-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      DATABASE_URL: ${DATABASE_URL}
      AUDIT_TRAIL_DB: ${AUDIT_TRAIL_DB}
      ZORVA_PHI_ENCRYPTION_KEY: ${ZORVA_PHI_ENCRYPTION_KEY}
      ZORVA_PRINCIPAL_SIGNING_SECRET: ${ZORVA_PRINCIPAL_SIGNING_SECRET}
      AUDIT_BEARER_TOKEN: ${AUDIT_BEARER_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ai_billing_audit_data:/data
      - ai_billing_audit_artifacts:/artifacts
      - ai_billing_audit_logs:/app/logs
    expose:
      - "8000"
    networks:
      - ai_billing_audit_net
    healthcheck:
      # Container health should include the required deployment baseline;
      # /healthz remains available for process liveness probes.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-billing-audit:0.4.0
    container_name: ai-billing-audit-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      DATABASE_URL: ${DATABASE_URL}
      AUDIT_TRAIL_DB: ${AUDIT_TRAIL_DB}
      ZORVA_PHI_ENCRYPTION_KEY: ${ZORVA_PHI_ENCRYPTION_KEY}
      ZORVA_PRINCIPAL_SIGNING_SECRET: ${ZORVA_PRINCIPAL_SIGNING_SECRET}
      AUDIT_BEARER_TOKEN: ${AUDIT_BEARER_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ai_billing_audit_data:/data
      - ai_billing_audit_artifacts:/artifacts
      - ai_billing_audit_logs:/app/logs
    networks:
      - ai_billing_audit_net
    # Override CMD: the worker runs the heartbeat loop instead of uvicorn.
    command: ["python", "-m", "ai_billing_audit.worker"]
    # Override the Dockerfile HEALTHCHECK (which curls :8000/healthz,
    # appropriate for the api but not the worker — the worker doesn't
    # bind any port, so the inherited check always fails and docker
    # perpetually reports "unhealthy"). Compose-level healthcheck
    # overrides Dockerfile-level, so we just need to verify the
    # worker process is alive. Fixed 2026-06-25 (kanban t_worker_health).
    #
    # We check /proc/1/cmdline (not `pgrep`, which isn't in the
    # python:3.12-slim image and would need an extra procps install).
    # In this container PID 1 IS the worker process (no init shim),
    # so verifying its cmdline contains the worker module name is
    # the most direct liveness signal.
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'ai_billing_audit.worker' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-billing-audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_billing_audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ai_billing_audit_pgdata:/var/lib/postgresql/data
      # audit_trail.sql ships in the repo (Phase 4 hash-chained log
      # schema). On first boot the entrypoint auto-applies every
      # *.sql in /docker-entrypoint-initdb.d/. The init script is
      # idempotent (CREATE TABLE IF NOT EXISTS) so re-applying on
      # subsequent boots is a no-op.
      - ./audit_trail.sql:/docker-entrypoint-initdb.d/01-audit_trail.sql:ro
    networks:
      - ai_billing_audit_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d ai_billing_audit"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  caddy:
    # Rate limit moved to Traefik (2026-06-25) — the caddy-ratelimit
    # module is no longer needed in the caddy image. Reverted to
    # stock caddy:2-alpine (which is what's been running anyway;
    # Dockerfile.caddy was never deployable: caddy-ratelimit@v0.1.0
    # requires Caddy v2.8.0+ but Dockerfile.caddy pinned v2.7.6,
    # so the build always failed and compose fell back to stock).
    # See /opt/traefik/dynamic/routers.yml for ai-billing-audit-ratelimit.
    image: caddy:2-alpine
    container_name: ai-billing-audit-caddy
    restart: unless-stopped
    ports:
      # Bound to loopback only — host Traefik reaches the stack via 127.0.0.1:3018.
      # Public HTTPS is terminated by Traefik with Let's Encrypt auto-issuance.
      - "127.0.0.1:3018:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ai_billing_audit_net
    # Caddy starts independently of api so there's no dependency
    # cycle. The api's `start_period: 30s` plus the caddy sidecar
    # sharing the same docker network means caddy can resolve the
    # `api` DNS name as soon as the api container is on the network,
    # even before its healthcheck flips green.

  # -------------------------------------------------------------------------
  # Portal (Next.js 16, marketing site + Stripe-backed checkout). Added
  # 2026-06-26. The portal's PUBLIC URL is zorva.ashbi.ca (a separate
  # Traefik router block in /opt/traefik/dynamic/routers.yml) — the api
  # stays at ai-billing-audit.ashbi.ca, so the two don't share a process
  # tree. See README.md §"Deploying" for the full topology.
  #
  # Standalone Next.js build (apps/portal/Dockerfile) ships only the
  # compiled server + static bundles, so the image is ~200MB instead of
  # pulling the full Next.js + React + Prisma + Stripe node_modules.
  #
  # Bound to host loopback only (127.0.0.1:3060:3020) — Traefik on the host
  # reaches it via the host network. No public port exposure.
  #
  # The build context is `portal/` because deploy-portal.sh rsyncs
  # apps/portal/ to that path on the VPS (NOT apps/portal/ on the VPS
  # — the deploy script flattens the apps/ namespace so the compose
  # context matches the rsync destination). The Dockerfile inside
  # uses `WORKDIR /app` so relative COPY paths inside the Dockerfile
  # are unaffected.
  # -------------------------------------------------------------------------
  portal:
    build:
      context: portal
      dockerfile: Dockerfile
    image: zorva-portal:0.1.0
    container_name: zorva-portal
    restart: unless-stopped
    env_file:
      - ./portal.env
    ports:
      - "127.0.0.1:3060:3020"
    networks:
      - ai_billing_audit_net
    healthcheck:
      # The Dockerfile defines a HEALTHCHECK that hits /login, which is
      # available without auth. Override here only to tighten the
      # start_period — Next.js 16 + Prisma generation + first DB query
      # takes longer than 30s on cold cache, so we give it 60s.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+process.env.PORT+'/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      portal-postgres:
        condition: service_healthy
      portal-migrate:
        condition: service_completed_successfully

  portal-migrate:
    build:
      context: portal
      dockerfile: Dockerfile
      target: migrate
    image: zorva-portal-migrate:0.1.0
    container_name: zorva-portal-migrate
    restart: "no"
    env_file:
      - ./portal.env
    networks:
      - ai_billing_audit_net
    depends_on:
      portal-postgres:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Portal Postgres. Separate from the FastAPI postgres so Prisma's
  # auth/audit/billing tables don't share a DB with the audit_trail /
  # job_queue tables. Each can be rotated / backed-up / scaled
  # independently.
  #
  # PORTAL_POSTGRES_PASSWORD is fail-closed (? syntax) — if the operator
  # forgets to set it in /opt/projects/ai-billing-audit/portal.env, the
  # container refuses to start. FastAPI's POSTGRES_PASSWORD is likewise
  # fail-closed (no `:-audit` default).
  # -------------------------------------------------------------------------
  portal-postgres:
    image: postgres:16-alpine
    container_name: zorva-portal-postgres
    restart: unless-stopped
    env_file:
      - ./portal.env
    environment:
      POSTGRES_USER: ${PORTAL_POSTGRES_USER:-portal}
      # Fail-closed: refuse to start if PORTAL_POSTGRES_PASSWORD is unset.
      # The deploy script (deploy-portal.sh) sources this from the host
      # secret file at /root/ai-billing-audit-secrets/portal_postgres_password.
      POSTGRES_PASSWORD: ${PORTAL_POSTGRES_PASSWORD:?PORTAL_POSTGRES_PASSWORD must be set in portal.env}
      POSTGRES_DB: ${PORTAL_POSTGRES_DB:-zorva_portal}
    volumes:
      - ai_billing_audit_portal_pgdata:/var/lib/postgresql/data
    networks:
      - ai_billing_audit_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTAL_POSTGRES_USER:-portal} -d ${PORTAL_POSTGRES_DB:-zorva_portal}"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  ai_billing_audit_data:
  ai_billing_audit_artifacts:
  ai_billing_audit_logs:
  ai_billing_audit_pgdata:
  ai_billing_audit_portal_pgdata:
  caddy_data:
  caddy_config:

networks:
  ai_billing_audit_net:
    driver: bridge
    name: ai_billing_audit_net
